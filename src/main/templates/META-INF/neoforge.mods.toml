modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
#updateJSONURL="https://change.me.example.invalid/updates.json"
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/"
#logoFile="pack.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

# 客户端方块变更监听需要注入 ClientLevel.setBlocksDirty，故声明 Mixin 配置。
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# AnvilLib 依赖：配置/网络/编解码/集成/工具五个模块各自是独立模组，
# 只需 config 为必需即可保证整套库被安装；其余模块本模组未直接引用，
# 声明为 optional 以免强制玩家额外安装。
[[dependencies."${mod_id}"]]
modId = "anvillib_config"
type = "required"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "anvillib_codec"
type = "optional"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "anvillib_network"
type = "optional"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "anvillib_integration"
type = "optional"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "anvillib_util"
type = "optional"
versionRange = "[2.0.0-0,3.0.0)"
ordering = "AFTER"
side = "BOTH"
