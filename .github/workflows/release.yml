name: Upload Release Asset
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      CI_BUILD: false
      PR_BUILD: false
      VERSION_TYPE: ${{ github.event.release.prerelease && 'alpha' || 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version minecraft_version modrinth_id curseforge_id upload publish'

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Resolve build artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort | head -n 1)
          sources=$(find build/libs -maxdepth 1 -type f -name '*-sources.jar' | sort | head -n 1)
          test -n "$jar"
          version=$(./gradlew -q properties | awk -F': ' '$1 == "version" { print $2; exit }')
          test -n "$version"
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "sources_path=$sources" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.properties.outputs.mod_name }} ${{ steps.artifact.outputs.version }}"
          path: ${{ steps.artifact.outputs.path }}

      - name: Attach jar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}

      - name: Publish to Maven
        if: ${{ steps.properties.outputs.publish == 'true' }}
        run: ./gradlew publish
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASS }}
        continue-on-error: true

      - name: Publish to Modrinth and CurseForge
        if: ${{ steps.properties.outputs.upload == 'true' && steps.properties.outputs.curseforge_id != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: "${{ steps.properties.outputs.mod_name }} for NeoForge ${{ steps.artifact.outputs.version }}"
          version: ${{ steps.artifact.outputs.version }}
          changelog: ${{ github.event.release.body }}
          version-type: ${{ env.VERSION_TYPE }}
          game-versions: ${{ steps.properties.outputs.minecraft_version }}
          loaders: neoforge
          java: ${{ steps.properties.outputs.java_version }}
          fail-mode: fail
          modrinth-id: ${{ steps.properties.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ steps.properties.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.sources_path }}
